<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- B · P / 双态：同一个字母左右并置，左源码线稿态、右渲染实心态 -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#143A5E"/>
      <stop offset="0.55" stop-color="#0C2743"/>
      <stop offset="1" stop-color="#071729"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.76" cy="0.22" r="0.78">
      <stop offset="0" stop-color="#2BB6AE" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#2BB6AE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#E9F8FF"/>
      <stop offset="0.55" stop-color="#BCEBF3"/>
      <stop offset="1" stop-color="#6FE3CE"/>
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="944" height="944" rx="212" fill="url(#tile)"/>
  <rect x="40" y="40" width="944" height="944" rx="212" fill="url(#glow)"/>
  <rect x="41" y="41" width="942" height="942" rx="211" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="2"/>

  <!-- 实时预览分栏 / 光标 -->
  <rect x="508" y="176" width="7" height="672" rx="3.5" fill="#BCEBF3" fill-opacity="0.22"/>

  <!-- 左 · 源码态：细线骨架 P -->
  <g transform="translate(286 512) scale(0.6) translate(-512 -512)">
    <path d="M 307 812 V 272 H 517 A 200 200 0 0 1 517 672 H 307"
          fill="none" stroke="#BCEBF3" stroke-opacity="0.72" stroke-width="20"
          stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <!-- 源码标记 # 落在线稿 P 的内孔里 -->
  <g stroke="#6FE3CE" stroke-width="10" stroke-linecap="round">
    <path d="M 216 452 L 208 520"/>
    <path d="M 250 452 L 242 520"/>
    <path d="M 202 472 L 260 472"/>
    <path d="M 199 500 L 257 500"/>
  </g>

  <!-- 右 · 渲染态：实心几何 P -->
  <g transform="translate(738 512) scale(0.6) translate(-512 -512)">
    <path d="M 307 812 V 272 H 517 A 200 200 0 0 1 517 672 H 307"
          fill="none" stroke="url(#mark)" stroke-width="120"
          stroke-linejoin="round" stroke-linecap="butt"/>
  </g>
</svg>
