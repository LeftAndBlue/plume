<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Plume 应用图标 · 净纸版：浅底 + 品牌色字母 P，内孔仍是实时预览窗 -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDF3F7"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1B3FA0"/>
      <stop offset="0.55" stop-color="#1C7FCB"/>
      <stop offset="1" stop-color="#12BFAE"/>
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="944" height="944" rx="212" fill="url(#tile)"/>
  <rect x="41" y="41" width="942" height="942" rx="211" fill="none" stroke="#0B2B4A" stroke-opacity="0.07" stroke-width="2"/>

  <path d="M 307 812 V 272 H 517 A 200 200 0 0 1 517 672 H 307"
        fill="none" stroke="url(#mark)" stroke-width="120"
        stroke-linejoin="round" stroke-linecap="butt"/>

  <!-- 源码 # -->
  <g stroke="#12BFAE" stroke-width="13" stroke-linecap="round">
    <path d="M 416 408 L 404 492"/>
    <path d="M 468 408 L 456 492"/>
    <path d="M 396 434 L 480 434"/>
    <path d="M 392 468 L 476 468"/>
  </g>
  <!-- 光标 -->
  <rect x="505" y="372" width="9" height="204" rx="4.5" fill="#1B3FA0" fill-opacity="0.28"/>
  <rect x="499" y="362" width="21" height="11" rx="3" fill="#12BFAE"/>
  <!-- 渲染结果 -->
  <rect x="540" y="426" width="96" height="23" rx="7" fill="#1B3FA0"/>
  <rect x="540" y="470" width="74" height="10" rx="5" fill="#1C7FCB" fill-opacity="0.62"/>
  <rect x="540" y="492" width="52" height="10" rx="5" fill="#1C7FCB" fill-opacity="0.38"/>
</svg>
